[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-investment-os-research"
version = "0.11.0"
description = "Research-only investment data and governance prototype; NO live trading"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<47"]

[project.optional-dependencies]
market_calendar = ["exchange-calendars>=4.8,<5"]
test = ["pytest>=8", "jsonschema>=4"]
embeddings = ["sentence-transformers>=3"]
quant = ["numpy>=1.26,<3", "scipy>=1.12,<2"]
ml = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.6,<2"]
warehouse = ["duckdb>=1.3,<2", "qdrant-client>=1.14,<2"]
pdf = ["docling>=2,<3"]
risk_crosscheck = ["skfolio>=0.10,<1", "pandas>=2,<4"]

[project.scripts]
atlas-screen = "atlas_pro.pipeline:main"
atlas-paper = "atlas_pro.paper_cli:main"
atlas-workflow = "atlas_pro.workflow:main"
atlas-oss = "atlas_pro.oss_cli:main"
atlas-shadow = "atlas_pro.shadow_cli:main"
atlas-certify = "atlas_pro.certify_cli:main"
atlas-quant = "atlas_pro.quant_train:main"
atlas-core = "atlas_pro.core_service:main"
atlas-bench = "atlas_pro.bench_runner:main"
atlas-role-review = "atlas_pro.role_review_cli:main"
atlas-l6 = "atlas_pro.l6_acceptance:main"
atlas-public-audit = "atlas_pro.public_acceptance:main"

[tool.setuptools]
py-modules = ["atlas_policy_router"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlas_pro*"]

[tool.setuptools.package-data]
atlas_pro = ["role_skills.json", "public_filing_smoke.json"]
