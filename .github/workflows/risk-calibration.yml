name: Public historical market risk audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_research_rights:
        description: Confirm personal research use of the historical archive; no raw data redistribution
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  public-market-risk:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_research_rights == true) ||
      (github.event_name == 'pull_request' && github.repository == 'RyanYang053/50agent-invest-system' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'atlas-0.14-risk-calibration')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[market_calendar,test]'
      - run: python -m pytest -q tests/test_risk_calibration.py
      - run: |
          curl --fail --location --proto '=https' --max-time 90 --max-filesize 2000000 'https://mba.tuck.dartmouth.edu/pages/Faculty/ken.french/ftp_202412/F-F_Research_Data_Factors_daily_CSV.zip' -o "$RUNNER_TEMP/french.zip"
          python -m atlas_pro.risk_calibration --zip "$RUNNER_TEMP/french.zip" --confirm-research-rights
          rm -f "$RUNNER_TEMP/french.zip"
