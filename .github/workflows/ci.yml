name: Offline research integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[market_calendar,test,quant,ml]'
      - run: python -m pytest -q
      - run: python -m atlas_pro
      - run: python -m atlas_pro.paper_replay
      - run: python -m atlas_pro.public_acceptance
      - run: python -m atlas_pro.core_service readiness
      - run: python -m atlas_pro.core_service catalog --roles "config/50 agent manifest.json"
      - run: python -m compileall -q src
  optional-data-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[market_calendar,test,quant,warehouse,ml]'
      - run: python -c 'import duckdb,qdrant_client'
      - run: python -m pytest -q tests/test_oss_adapters.py
  optional-risk-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,quant,risk_crosscheck]'
      - run: python -c 'import skfolio,pandas'
      - run: python -m pytest -q tests/test_oss_adapters.py -k skfolio_optional
  optional-option-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,option_crosscheck]'
      - run: python -c 'import QuantLib; print(QuantLib.__version__)'
      - run: python -m pytest -q tests/test_option_crosscheck.py
  isolated-quant-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file sandbox/Dockerfile --tag atlas-research:ci .
      - run: |
          image=$(docker image inspect --format '{{.Id}}' atlas-research:ci)
          bash sandbox/run-research.sh "$image" "$RUNNER_TEMP/atlas-quant.json"
          python - "$RUNNER_TEMP/atlas-quant.json" <<'PYCODE'
          import json, sys
          r=json.load(open(sys.argv[1]))
          assert r['synthetic'] is True and r['can_trade'] is False
          assert set(r['models'])=={'ridge','hist_gradient_boosting'}
          assert all(v['n_predictions']>0 for v in r['models'].values())
          print('network-isolated OCI training passed; synthetic research only')
          PYCODE

  public-empirical-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[market_calendar,test,empirical]'
      - run: python -m pytest -q tests/test_evidence_recomputation.py
      - run: python -m atlas_pro.public_empirical --output "$RUNNER_TEMP/atlas-empirical.json" > /dev/null
      - run: |
          python - "$RUNNER_TEMP/atlas-empirical.json" <<'PYCODE'
          import json, sys
          r=json.load(open(sys.argv[1]))
          assert r['macro']['observations']==203 and r['industrial_panel']['observations']==220
          assert r['macro']['true_pit'] is False and r['can_trade'] is False
          print('public real-data developer reference passed; no alpha claim')
          PYCODE

  isolated-qlib-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file sandbox/Dockerfile.qlib --tag atlas-qlib:ci .
      - run: |
          image=$(docker image inspect --format '{{.Id}}' atlas-qlib:ci)
          bash sandbox/run-research.sh --qlib "$image" "$RUNNER_TEMP/atlas-qlib.json"
          python - "$RUNNER_TEMP/atlas-qlib.json" <<'PYCODE'
          import json, sys
          r=json.load(open(sys.argv[1]))
          assert r['synthetic'] is True and r['can_trade'] is False and r['promotion_allowed'] is False
          assert set(r['models'])=={'ridge','hist_gradient_boosting','qlib_ridge'}
          receipts=r['external_engine_receipts']
          assert len(receipts)==r['folds']>0
          assert all(x['version']=='0.9.7' and x['test_labels_supplied'] is False and x['max_reference_error']<=1e-7 for x in receipts)
          a=r['models']['ridge']['predictions']; b=r['models']['qlib_ridge']['predictions']
          assert len(a)==len(b)>0 and [x['id'] for x in a]==[x['id'] for x in b]
          assert max(abs(x['prediction']-y['prediction']) for x,y in zip(a,b))<1e-8
          print('actual Qlib training executed in offline container; synthetic data only')
          PYCODE

  isolated-lean-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_lean_fixture.py
      - name: Acquire upstream LEAN image (CI reference only)
        run: |
          docker pull quantconnect/lean:latest
          docker image inspect --format '{{json .RepoDigests}}' quantconnect/lean:latest
      - name: Run network-isolated synthetic accounting case
        run: |
          image=$(docker image inspect --format '{{.Id}}' quantconnect/lean:latest)
          bash sandbox/run-lean-fixture.sh "$image" "$RUNNER_TEMP/atlas-lean.json"
          python - "$RUNNER_TEMP/atlas-lean.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['status']=='LEAN_SYNTHETIC_ACCOUNTING_CHECKED'
          assert r['synthetic'] is True and r['can_trade'] is False and r['promotion_allowed'] is False
          assert r['simulated_fill_count']==2 and r['ending_cash']==10098 and r['fees']==2
          print('actual LEAN synthetic order and fee events independently reconciled')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lean-synthetic-accounting-receipt
          path: ${{ runner.temp }}/atlas-lean.json
          if-no-files-found: error
          retention-days: 14
